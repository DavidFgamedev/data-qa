[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "data-qa"
version = "1.0.0"
description = "Validation for gameplay data tables: schema, ranges, references and balance invariants"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "David Fernandez", email = "sfgamedesign@gmail.com" }]
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7.4", "pytest-cov>=4.1", "hypothesis>=6.92"]

[project.scripts]
data-qa = "data_qa.cli:main"

[tool.setuptools]
packages = ["data_qa", "data_qa.checks"]

[tool.setuptools.package-data]
data_qa = ["schemas/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.coverage.run]
source = ["data_qa"]
branch = true

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM"]
ignore = [
  # The checks share a shape: iterate the schema, skip what another rule owns, append a
  # finding. Flattening that into comprehensions would make the skip conditions, which
  # are the interesting part, harder to read than the loop.
  "SIM102",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]
